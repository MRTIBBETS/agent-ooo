name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive-name: agent-ooo-macos-aarch64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive-name: agent-ooo-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cap'n Proto (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install capnp

      - name: Install Cap'n Proto (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package release
        shell: bash
        run: |
          mkdir release_pkg
          cp target/${{ matrix.target }}/release/agent-ooo release_pkg/
          cp target/${{ matrix.target }}/release/ooo release_pkg/
          cp README.md release_pkg/
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md release_pkg/; fi
          if [ -f LICENSE ]; then cp LICENSE release_pkg/; fi
          
          cd release_pkg
          tar -czvf ../${{ matrix.archive-name }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive-name }}
          path: ${{ matrix.archive-name }}

  create-release:
    name: Create GitHub Release
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # We want to commit back to the main branch
          
      - name: Update Formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAC_SHA=$(curl -sL https://github.com/mrtibbets/agent-ooo/releases/download/${GITHUB_REF_NAME}/agent-ooo-macos-aarch64.tar.gz | shasum -a 256 | awk '{print $1}')
          LINUX_SHA=$(curl -sL https://github.com/mrtibbets/agent-ooo/releases/download/${GITHUB_REF_NAME}/agent-ooo-linux-x86_64.tar.gz | shasum -a 256 | awk '{print $1}')
          
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/agent-ooo.rb
          
          # Update Mac SHA
          sed -i "/on_macos do/,/end/ s/sha256 \".*\"/sha256 \"${MAC_SHA}\"/" Formula/agent-ooo.rb
          sed -i "/on_macos do/,/end/ s|url \".*\"|url \"https://github.com/mrtibbets/agent-ooo/releases/download/${GITHUB_REF_NAME}/agent-ooo-macos-aarch64.tar.gz\"|" Formula/agent-ooo.rb
          
          # Update Linux SHA
          sed -i "/on_linux do/,/end/ s/sha256 \".*\"/sha256 \"${LINUX_SHA}\"/" Formula/agent-ooo.rb
          sed -i "/on_linux do/,/end/ s|url \".*\"|url \"https://github.com/mrtibbets/agent-ooo/releases/download/${GITHUB_REF_NAME}/agent-ooo-linux-x86_64.tar.gz\"|" Formula/agent-ooo.rb
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-ooo.rb
          git commit -m "chore: auto-update Homebrew formula for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin main
