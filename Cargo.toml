[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alexander Tibbets <alexander@mrtibbets.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrtibbets/agent-ooo"
homepage = "https://github.com/mrtibbets/agent-ooo"
description = "Spa retreats for your AI. Reset, refresh, relax."

[workspace.dependencies]
capnp = "0.20"
capnpc = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
blake3 = "1.5"
memmap2 = "0.9"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
